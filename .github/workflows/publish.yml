# Publish easywave-home-control to PyPI
#
# Triggered by pushing a version tag (e.g. v0.1.0).
# Uses PyPI Trusted Publisher (OIDC) — no API token required.
#
# Setup required (one-time):
#   1. PyPI → Your project → Settings → Publishing → Add a new pending publisher
#      - Owner:    <your-github-username-or-org>
#      - Repo:     RxModule-PyPi_Bibliothek
#      - Workflow: publish.yml
#      - Environment: release
#   2. GitHub → Repo → Settings → Environments → Create "release" environment

name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # triggers on tags like v0.1.0, v1.2.3

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release   # must match the environment configured in PyPI Trusted Publisher

    permissions:
      id-token: write      # required for OIDC Trusted Publisher authentication

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

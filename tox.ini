[tox]
envlist = py{39,310,311,312,313},lint,type

[testenv]
deps =
    pytest>=7.0
    pytest-cov
commands =
    pytest tests/ -v --cov=easywave_home_control

[testenv:lint]
basepython = python3.10
deps =
    ruff
commands =
    ruff check easywave_home_control examples

[testenv:type]
basepython = python3.10
deps =
    mypy
    types-setuptools
commands =
    mypy easywave_home_control

[testenv:dev]
basepython = python3.10
deps =
    -e .[dev]
    pytest
    pytest-cov
    ruff
    mypy
usedevelop = True
